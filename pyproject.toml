[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-ai-research-lab"
version = "0.1.0"
description = "Leakage-controlled scientific claim verification research baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.4",
  "pandas==3.0.6",
  "rank-bm25==0.2.2",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "sentence-transformers==6.1.0",
  "torch==2.14.1",
  "transformers==5.19.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the pinned Hugging Face model"]
